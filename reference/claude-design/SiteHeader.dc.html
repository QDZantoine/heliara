<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:color-mix(in srgb, var(--bg-page) 82%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-default)">
  <div style="max-width:1240px;margin:0 auto;height:68px;padding:0 20px 0 24px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="Heliara — Homepage.dc.html" style="font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.02em;color:var(--text-primary)">heliara<span style="color:var(--accent)">.</span></a>
    <nav class="hnav-links" aria-label="Navigation principale">
      <sc-for list="{{ links }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" aria-current="{{ n.current }}" style="font-size:13.5px;font-weight:{{ n.weight }};color:{{ n.color }};transition:color 100ms" style-hover="color:var(--text-primary)">{{ n.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="Heliara — Contact.dc.html" style="height:44px;padding:0 18px;display:inline-flex;align-items:center;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:14px;font-weight:500;transition:background-color 100ms var(--ease-out),box-shadow 100ms var(--ease-out)" style-hover="background:var(--accent-hover);box-shadow:var(--shadow-glow)"><span class="hnav-cta-long">Parlons de votre projet</span><span class="hnav-cta-short">Contact</span></a>
      <button class="hnav-burger" onClick="{{ ouvrir }}" aria-label="Ouvrir le menu" aria-expanded="{{ ouvert }}" style="width:44px;height:44px;align-items:center;justify-content:center;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-primary);cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5H16M2 12H16" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>

  <!-- Menu mobile plein écran -->
  <sc-if value="{{ menuOuvert }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Menu" style="position:fixed;inset:0;z-index:400;background:var(--bg-page);display:flex;flex-direction:column;overflow:auto;animation:hel-fade-menu 240ms cubic-bezier(0.16,1,0.3,1)">
      <div style="position:absolute;inset:0;background:var(--halo-warm);pointer-events:none"></div>
      <div style="position:relative;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 20px 0 24px;border-bottom:1px solid var(--border-default);flex:none">
        <span style="font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.02em;color:var(--text-primary)">heliara<span style="color:var(--accent)">.</span></span>
        <button onClick="{{ fermer }}" ref="{{ closeRef }}" aria-label="Fermer le menu" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-primary);cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
      <nav style="position:relative;flex:1;padding:28px 24px;display:flex;flex-direction:column;gap:2px" aria-label="Menu mobile">
        <sc-for list="{{ menuLinks }}" as="m" hint-placeholder-count="6">
          <a href="{{ m.href }}" style="display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:8px 4px;border-bottom:1px solid var(--border-default);font-family:var(--font-display);font-weight:700;font-size:29px;letter-spacing:-0.025em;color:{{ m.color }}" style-active="color:var(--accent-text)">
            {{ m.label }}
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)">{{ m.num }}</span>
          </a>
        </sc-for>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:24px">
          <a href="Heliara — Expertise SaaS.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:14.5px;color:var(--text-secondary)">Plateformes &amp; SaaS</a>
          <a href="Heliara — Expertises.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:14.5px;color:var(--text-secondary)">Sites &amp; e-commerce</a>
          <a href="Heliara — Expertises.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:14.5px;color:var(--text-secondary)">IA &amp; API</a>
          <a href="Heliara — Expertises.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:14.5px;color:var(--text-secondary)">Toutes les expertises</a>
        </div>
      </nav>
      <div style="position:relative;flex:none;padding:20px 24px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--border-default)">
        <a href="Heliara — Contact.dc.html" style="height:52px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:16px;font-weight:500;margin-bottom:16px" style-active="background:var(--accent-active)">Parlons de votre projet</a>
        <div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--text-tertiary);flex-wrap:wrap">
          <a href="Heliara — Le Groupe.dc.html" style="color:var(--text-tertiary);min-height:44px;display:inline-flex;align-items:center">Une marque du groupe Hexceos</a>
          <a href="#" style="color:var(--text-tertiary);min-height:44px;display:inline-flex;align-items:center">Mentions légales</a>
        </div>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1240, &quot;height&quot;: 68 },
  &quot;current&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;, &quot;Expertises&quot;, &quot;Réalisations&quot;, &quot;Méthode&quot;, &quot;À propos&quot;, &quot;Ressources&quot;, &quot;Carrières&quot;], &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  state = { ouvert: false };
  closeRef = React.createRef();
  componentDidMount() {
    this._onKey = (e) => { if (e.key === 'Escape' && this.state.ouvert) this.setState({ ouvert: false }); };
    document.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() { document.removeEventListener('keydown', this._onKey); }
  componentDidUpdate(_, prev) {
    if (!prev.ouvert && this.state.ouvert && this.closeRef.current) this.closeRef.current.focus();
    document.body.style.overflow = this.state.ouvert ? 'hidden' : '';
    if (typeof document !== 'undefined' && !document.getElementById('hel-css-menu')) {
      const s = document.createElement('style'); s.id = 'hel-css-menu';
      s.textContent = '@keyframes hel-fade-menu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}';
      document.head.appendChild(s);
    }
  }
  renderVals() {
    const current = this.props.current ?? '';
    const items = [
      ['Expertises', 'Heliara — Expertises.dc.html'],
      ['Réalisations', 'Heliara — Réalisations.dc.html'],
      ['Méthode', 'Heliara — Méthode.dc.html'],
      ['À propos', 'Heliara — À propos.dc.html'],
      ['Ressources', 'Heliara — Ressources.dc.html'],
      ['Carrières', 'Heliara — Carrières.dc.html'],
    ];
    return {
      ouvert: this.state.ouvert ? 'true' : 'false',
      menuOuvert: this.state.ouvert,
      ouvrir: () => this.setState({ ouvert: true }),
      fermer: () => this.setState({ ouvert: false }),
      closeRef: this.closeRef,
      links: items.map(([label, href]) => ({
        label, href,
        current: label === current ? 'page' : undefined,
        weight: label === current ? '600' : '500',
        color: label === current ? 'var(--text-primary)' : 'var(--text-secondary)',
      })),
      menuLinks: items.map(([label, href], i) => ({
        label, href, num: '0' + (i + 1),
        color: label === current ? 'var(--accent-text)' : 'var(--text-primary)',
      })),
    };
  }
}
</script>
</body>
</html>
